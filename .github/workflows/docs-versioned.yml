name: Docs Versioned Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label to publish (for example 1.0.0, latest, dev)"
        required: false
        default: ""
      update_latest:
        description: "Also update latest alias"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  publish-versioned-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Resolve publication version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="latest"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            UPDATE_LATEST="${{ inputs.update_latest }}"
          elif [[ "$VERSION" == "latest" ]]; then
            UPDATE_LATEST="true"
          else
            UPDATE_LATEST="true"
          fi

          echo "DOC_VERSION=$VERSION" >> $GITHUB_ENV
          echo "UPDATE_LATEST=$UPDATE_LATEST" >> $GITHUB_ENV

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: Generate API pages
        run: uv run python docs-site/scripts/build_api_docs.py

      - name: Sync changelog page
        run: uv run python docs-site/scripts/sync_changelog.py

      - name: Build docs
        run: uv run python docs-site/scripts/mkdocs2.py build

      - name: Prepare gh-pages branch
        shell: bash
        run: |
          if git ls-remote --heads origin gh-pages | grep gh-pages; then
            git fetch origin gh-pages
            git worktree add gh-pages origin/gh-pages
          else
            git worktree add --detach gh-pages
            cd gh-pages
            git checkout --orphan gh-pages
            git reset --hard
          fi

      - name: Copy built version to gh-pages
        shell: bash
        run: |
          rm -rf "gh-pages/${DOC_VERSION}"
          mkdir -p "gh-pages/${DOC_VERSION}"
          cp -r docs-site/site/. "gh-pages/${DOC_VERSION}/"

          if [[ "${UPDATE_LATEST}" == "true" ]]; then
            rm -rf gh-pages/latest
            mkdir -p gh-pages/latest
            cp -r docs-site/site/. gh-pages/latest/
          fi

      - name: Write root redirect and versions manifest
        shell: bash
        run: |
          cat > gh-pages/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./latest/">
              <title>Redirecting to latest docs</title>
            </head>
            <body>
              <p>Redirecting to <a href="./latest/">latest documentation</a>...</p>
            </body>
          </html>
          EOF

          if [[ -f docs-site/site/robots.txt ]]; then
            cp docs-site/site/robots.txt gh-pages/robots.txt
          fi

          if [[ -f docs-site/site/sitemap.xml ]]; then
            cp docs-site/site/sitemap.xml gh-pages/sitemap.xml
          fi

          if compgen -G "docs-site/site/google*.html" > /dev/null; then
            cp docs-site/site/google*.html gh-pages/
          fi

          uv run python docs-site/scripts/build_versions_manifest.py gh-pages latest

          cp gh-pages/versions.json "gh-pages/${DOC_VERSION}/versions.json"

          if [[ "${UPDATE_LATEST}" == "true" ]]; then
            cp gh-pages/versions.json gh-pages/latest/versions.json
          fi

      - name: Commit and push gh-pages
        shell: bash
        run: |
          cd gh-pages
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          if git diff --cached --quiet; then
            echo "No docs changes to publish"
            exit 0
          fi
          git commit -m "docs: publish ${DOC_VERSION}"
          git push origin HEAD:gh-pages
