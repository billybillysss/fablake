name: Docs

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: Generate API pages
        run: uv run python docs-site/scripts/build_api_docs.py

      - name: Sync changelog page
        run: uv run python docs-site/scripts/sync_changelog.py

      - name: Build docs
        run: uv run python docs-site/scripts/mkdocs2.py build
